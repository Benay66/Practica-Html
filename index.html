    <div>
        <h2>Iniciar Sesión</h2>
        <p>Ingresa tus datos para acceder a tu cuenta. Los campos marcados con <strong>*</strong> son obligatorios.</p>

        <form>
            <label for="username">Usuario <strong>*</strong></label><br />
            <input type="text" id="username" name="username" placeholder="Ingresa tu usuario"><br /><br />

            <label for="password">Contraseña <strong>*</strong></label><br />
            <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña"><br /><br />

            <input type="submit" value="Ingresar">
        </form>
    </div>

    <div>
        <p>¿Quieres saber quién soy? Visita mi página de <a href="profile.html">perfil</a>.</p>
    </div>

    </footer>
