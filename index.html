<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Mi Sitio Web</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <nav class="navbar navbar-light site-navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">Mi Sitio Web</a>
            <ul class="navbar-nav flex-row flex-wrap justify-content-center">
                <li class="nav-item mx-2"><a class="nav-link active" aria-current="page" href="index.html">Inicio / Login</a></li>
                <li class="nav-item mx-2"><a class="nav-link" href="tags.html">Etiquetas HTML</a></li>
                <li class="nav-item mx-2"><a class="nav-link" href="profile.html">Perfil</a></li>
            </ul>
        </div>
    </nav>

    <header>
        <h1>Mi Sitio Web</h1>
        <p>Práctica de CSS y Bootstrap</p>
    </header>

    <div class="container">
        <div class="login-card">
            <h2 class="text-center mb-3">Iniciar Sesión</h2>

            <!-- Párrafo seleccionado por clase: color compartido con otros párrafos .lead-text -->
            <p class="lead-text">Ingresa tus datos para acceder a tu cuenta. Los campos marcados con <strong>*</strong> son obligatorios.</p>

            <form>
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario <strong>*</strong></label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Ingresa tu usuario">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña <strong>*</strong></label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Ingresa tu contraseña">
                </div>

                <button type="submit" class="btn btn-dark w-100">Ingresar</button>
            </form>
        </div>

        <div class="seccion text-center">
            <p>¿Quieres saber quién soy? Visita mi página de <a href="profile.html">perfil</a>.</p>
        </div>

    </div>

    <footer>
        <p><sub>Proyecto académico</sub> <sup>&copy;</sup> 2026</p>
    </footer>

</body>
</html>
